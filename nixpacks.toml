# Railway/Nixpacks build config.
#
# The MCP server renders bill invoices to PDF with a headless browser
# (render_bill_pdf / download_bills_pdf via puppeteer-core). puppeteer-core
# ships NO browser of its own, so Chromium must be provided by the image.
#
# `chromium` here is the Nix package. Nixpacks installs it into /nix/store and
# it is present in the runtime image, but its hashed store path is not stable
# and its bin dir is not reliably on the runtime $PATH — so PATH auto-detection
# fails ("No Chromium found for PDF rendering"). Detection is therefore handled
# in code: findChromium() scans $PATH and common locations and then falls back
# to scanning /nix/store directly (see src/clio/billRender.ts), which reliably
# locates the Nix chromium binary regardless of $PATH. To override, set
# PUPPETEER_EXECUTABLE_PATH to a specific binary path in the Railway dashboard.
[phases.setup]
nixPkgs = ["nodejs", "chromium"]
