name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build (esbuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tsc is memory-hungry on this project (large dependency type graphs);
      # give the compiler extra heap so the type graph fits on CI runners.
      - run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144
