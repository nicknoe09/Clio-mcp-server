name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build (esbuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tsc is memory-hungry on this project (large dependency type graphs +
      # many zod tool schemas); give it ample heap. Public-repo hosted runners
      # have ~16 GB RAM, so 12 GB is safe and well above what the compiler needs.
      - run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=12288
